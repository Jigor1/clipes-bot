name: Varredura de clipes
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths: ["trigger/**"]
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependencias
        run: pip install -q -r bot/requirements.txt
      - name: Varrer clipes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python bot/scan.py
      - name: Salvar memoria e relatorio
        run: |
          git config user.name "clipes-bot"
          git config user.email "clipes-bot@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet && exit 0
          git commit -q -m "varredura $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
